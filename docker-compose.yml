# HackPilot YAML configuration
services:
  # PostgreSQL Database
  hackpilot-database:
    image: postgres:15-alpine
    container_name: hackpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackpilot}
      POSTGRES_USER: ${POSTGRES_USER:-hackpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env file}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - hackpilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackpilot -d hackpilot"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  hackpilot-redis:
    image: redis:7-alpine
    container_name: hackpilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env file}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - hackpilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # HackPilot Main Application — API server
  hackpilot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackpilot-app
    restart: unless-stopped
    command: ["--api"]
    depends_on:
      hackpilot-database:
        condition: service_healthy
      hackpilot-redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://hackpilot:${POSTGRES_PASSWORD}@hackpilot-database:5432/hackpilot
      - REDIS_URL=redis://:${REDIS_PASSWORD}@hackpilot-redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HACKPILOT_PROVIDER=${HACKPILOT_PROVIDER}
      - HACKPILOT_MODEL=${HACKPILOT_MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=INFO
      - ENABLE_API_SERVER=true
      - REPORT_ENCRYPTION_KEY=${REPORT_ENCRYPTION_KEY:-}
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./wordlists:/app/wordlists
      - ./tools:/app/tools
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"  # API Server
    networks:
      - hackpilot-network
    security_opt:
      - seccomp:unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # HackPilot Web Dashboard — separate process, --api and --web are mutually
  # exclusive in advance_hackpilot.py's main(), so this cannot share hackpilot-app.
  hackpilot-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackpilot-web
    restart: unless-stopped
    command: ["--web"]
    depends_on:
      hackpilot-database:
        condition: service_healthy
      hackpilot-redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://hackpilot:${POSTGRES_PASSWORD}@hackpilot-database:5432/hackpilot
      - REDIS_URL=redis://:${REDIS_PASSWORD}@hackpilot-redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HACKPILOT_PROVIDER=${HACKPILOT_PROVIDER}
      - HACKPILOT_MODEL=${HACKPILOT_MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=INFO
      - ENABLE_WEB_DASHBOARD=true
      # Dashboard auth gate (security/dashboard_auth.py). Unset by default,
      # which keeps the process bound to 127.0.0.1 inside the container -
      # set all three in .env to allow authenticated LAN/remote access.
      - CONSOLE_AUTH_USER=${CONSOLE_AUTH_USER:-}
      - CONSOLE_AUTH_PASS_HASH=${CONSOLE_AUTH_PASS_HASH:-}
      - CONSOLE_ALLOWED_IPS=${CONSOLE_ALLOWED_IPS:-127.0.0.1}
      # Report-at-rest encryption (security/report_crypto.py). Unset ->
      # reports are written unencrypted with a logged warning.
      - REPORT_ENCRYPTION_KEY=${REPORT_ENCRYPTION_KEY:-}
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    ports:
      - "8080:8080"  # Web Dashboard
    networks:
      - hackpilot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Celery Worker for Background Tasks
  hackpilot-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # The image ENTRYPOINT is `python3 advance_hackpilot.py`; command: alone
    # would be appended as argv to that script instead of replacing it.
    entrypoint: []
    command: celery -A performance.parallel_processor worker --loglevel=info --concurrency=4
    depends_on:
      hackpilot-database:
        condition: service_healthy
      hackpilot-redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://hackpilot:${POSTGRES_PASSWORD}@hackpilot-database:5432/hackpilot
      - REDIS_URL=redis://:${REDIS_PASSWORD}@hackpilot-redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HACKPILOT_PROVIDER=${HACKPILOT_PROVIDER}
      - HACKPILOT_MODEL=${HACKPILOT_MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=INFO
      - REPORT_ENCRYPTION_KEY=${REPORT_ENCRYPTION_KEY:-}
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./wordlists:/app/wordlists
      - ./tools:/app/tools
    networks:
      - hackpilot-network
    deploy:
      replicas: 2

  # Celery Beat Scheduler
  hackpilot-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackpilot-scheduler
    restart: unless-stopped
    entrypoint: []
    command: celery -A performance.parallel_processor beat --loglevel=info
    depends_on:
      hackpilot-database:
        condition: service_healthy
      hackpilot-redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://hackpilot:${POSTGRES_PASSWORD}@hackpilot-database:5432/hackpilot
      - REDIS_URL=redis://:${REDIS_PASSWORD}@hackpilot-redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HACKPILOT_PROVIDER=${HACKPILOT_PROVIDER}
      - HACKPILOT_MODEL=${HACKPILOT_MODEL}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    networks:
      - hackpilot-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: hackpilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - hackpilot-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: hackpilot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env file}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - hackpilot-network
    depends_on:
      - prometheus

  # Elasticsearch for Logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: hackpilot-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - hackpilot-network

  # Kibana for Log Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: hackpilot-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - hackpilot-network
    depends_on:
      - elasticsearch

  # Consul for Service Discovery
  consul:
    image: hashicorp/consul:latest
    container_name: hackpilot-consul
    restart: unless-stopped
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -data-dir=/consul/data
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    networks:
      - hackpilot-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hackpilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - hackpilot-network
    depends_on:
      - hackpilot-app
      - hackpilot-web

  # Flower for Celery Monitoring
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackpilot-flower
    restart: unless-stopped
    entrypoint: []
    command: celery -A performance.parallel_processor flower --port=5555 --broker=redis://:${REDIS_PASSWORD}@hackpilot-redis:6379/0
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@hackpilot-redis:6379/0
    networks:
      - hackpilot-network
    depends_on:
      - hackpilot-redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  consul_data:
    driver: local

networks:
  hackpilot-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
